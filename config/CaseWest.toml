# Dead Rising 2: Case West — XenonRecomp main config.
#
# Title: Dead Rising 2: Case West (Capcom / Blue Castle Games, 2010), XBLA arcade title
# 58410B00. Shipped as an STFS package, not a disc — unpack it with
# `tools/extract_stfs.py` before anything here will work.
#
# XEX identity (established 2026-08-15, see docs/bootstrap-2026-08-15.md):
#   image base   0x82000000      entry point 0x825AC918
#   image size   0xB40000        .text 0x82150000 + 0x87BC54
#                                BINK  0x829CBE00 + 0x0106B8   <-- a SECOND code section
#   encryption 1 (**devkit / all-zero key**, NOT the retail key), compression 2 (LZX).
#
# The devkit key is the same trap Case Zero hit: stock XenonRecomp hardcodes the retail
# key and returns an empty Image with no diagnostic when it is wrong. The local
# XenonRecomp carries the fix (`Xex2LoadImage` tries both keys) — see Case Zero's
# docs/xenonrecomp-upstream-bugs.md. Recompiling with an unpatched XenonRecomp will
# fail silently; that is the first thing to check if the run below produces nothing.
#
# THE ONE STRUCTURAL DIFFERENCE FROM CASE ZERO, stated here because it is invisible
# everywhere else: this title statically links the RAD Game Tools Bink decoder, and it
# arrives as its OWN executable section (`BINK`, 67 KB, SectionFlags_Code) plus three
# data sections. XenonRecomp recompiles every code section, so this is handled for
# free by the recompiler — but any *analysis tool* that assumes one code range will
# silently skip it. `tools/find_jumptables.py` was fixed to read the section map
# instead; it finds one absolute table in there.
[main]
# Function overrides. EMPTY ON PURPOSE — this is the pre-first-recompilation state.
#
# It will grow from three sources that MERGE, NEVER REPLACE each other (Case Zero
# ended at 139 entries):
#   1. tools/fix_switch_function_bounds.py --apply   switch-tail repairs
#   2. tools/coverage_to_function_overrides.py       entry points recovered from Xenia
#                                                    --trace_function_data coverage
#   3. tools/find_dropped_branches.py --widen        truncated functions widened over
#                                                    their outlined cold blocks
# Where two sources name the same address the LARGER size wins, so they compose in any
# order. Run all three against a `ppc/` regenerated from THIS file — every one of them
# reads the emitted code to decide what is missing, so a stale `ppc/` makes all three
# under-report silently, and nothing reports that they did.
