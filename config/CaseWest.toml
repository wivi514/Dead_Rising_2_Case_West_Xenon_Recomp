skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers, found by `tools/find_save_restore.py` (structural
# ladder scan of the loaded image, 2026-08-15). All eight found in one pass, and the
# four vector ladders are contiguous — 0x82833730 + 0x94 = 0x828337C4,
# + 0x204 = 0x828339C8, + 0x94 = 0x82833A5C — which is the cross-check that they are
# the real ladders and not an 18-rung suffix of a 64-rung one.
#
# Same idiom split as Case Zero: the gpr ladders are r1-based and the fpr ladders are
# r12-based. XenonRecomp does not care, but a scanner with the base register hardcoded
# reports half of them missing.
